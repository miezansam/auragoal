name: auragoal
description: "AURAGOAL — plateforme de développement personnel avec coach IA AURA."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Backend / Supabase
  supabase_flutter: ^2.5.6

  # Modèles & sérialisation
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # UI & utilitaires
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1

  # Notifications locales (rappels habitudes / objectifs)
  flutter_local_notifications: ^17.2.2

  # Stockage local léger (préférences, cache offline)
  shared_preferences: ^2.2.3

  # Env / configuration
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Génération de code
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/

  # fonts:
  #   - family: Inter
  #     fonts:
  #       - asset: assets/fonts/Inter-Regular.ttf
  #       - asset: assets/fonts/Inter-Bold.ttf
  #         weight: 700
